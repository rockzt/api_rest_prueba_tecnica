services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres_db:5432/liv_test_docker
    depends_on:
      - postgres_db
    volumes:
      - .:/usr/src/app




  postgres_db:
    image: postgres:16
    ports:
      - "5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: liv_test_docker

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    depends_on:
      - postgres_db # Ensures postgres starts first

volumes:
  postgres_data:
    driver: local

networks:
  # Define a custom network for the services to communicate
  mynet:
    driver: bridge

